name: ecopulse

x-application: &application
  image: ecopulse-backend:${ECOPULSE_IMAGE_TAG:-local}
  build:
    context: ..
    dockerfile: backend/Dockerfile
  restart: unless-stopped
  environment: &application-environment
    ECOPULSE_MODE: full
    DATABASE_URL: postgresql+psycopg://ecopulse:${POSTGRES_PASSWORD:?Gere o .env local}@db:5432/ecopulse
    AMQP_URLS: amqp://ecopulse:${RABBIT_PASSWORD:?Gere o .env local}@rabbit1:5672/
    REDIS_CLUSTER_URLS: redis://:${REDIS_PASSWORD:?Gere o .env local}@redis1:6379,redis://:${REDIS_PASSWORD}@redis2:6379,redis://:${REDIS_PASSWORD}@redis3:6379
    JWT_SECRET: ${JWT_SECRET:?Gere o .env local}
    RABBIT_QUORUM_SIZE: "1"
    SHARD_COUNT: "4"
    DATA_DIR: /app/data
    ORS_API_KEY: ${ORS_API_KEY:-}
    FCM_CREDENTIALS_FILE: ${FCM_CREDENTIALS_FILE:-}
  volumes:
    - ../secrets:/run/secrets:ro
  depends_on:
    db:
      condition: service_healthy
    rabbit1:
      condition: service_healthy
    rabbit-init:
      condition: service_completed_successfully
    redis-init:
      condition: service_completed_successfully

x-redis: &redis
  image: redis:8.2.10-alpine
  restart: unless-stopped
  environment:
    REDIS_PASSWORD: ${REDIS_PASSWORD:?Gere o .env local}
  healthcheck:
    test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
    interval: 5s
    timeout: 3s
    retries: 20

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecopulse
      POSTGRES_USER: ecopulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Gere o .env local}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?Gere o .env local}
    command: [postgres, -c, wal_level=replica, -c, max_wal_senders=10, -c, max_replication_slots=10, -c, wal_keep_size=256MB, -c, max_slot_wal_keep_size=1024MB, -c, synchronous_commit=on]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/10-replication.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U ecopulse -d ecopulse']
      interval: 5s
      timeout: 5s
      retries: 30

  rabbit1:
    image: rabbitmq:4.3.6-management
    hostname: rabbit1
    restart: unless-stopped
    environment:
      RABBITMQ_NODENAME: rabbit@rabbit1
      RABBITMQ_DEFAULT_USER: ecopulse
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?Gere o .env local}
      RABBITMQ_ERLANG_COOKIE: ${RABBIT_ERLANG_COOKIE:?Gere o .env local}
    volumes:
      - rabbit1-data:/var/lib/rabbitmq
      - ./rabbit/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbit/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - 127.0.0.1:15672:15672
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 10s
      retries: 30

  redis1:
    <<: *redis
    command: [sh, -c, 'exec redis-server --appendonly yes --cluster-enabled yes --cluster-config-file /data/nodes.conf --cluster-node-timeout 5000 --cluster-announce-hostname redis1 --cluster-preferred-endpoint-type hostname --requirepass "$$REDIS_PASSWORD" --masterauth "$$REDIS_PASSWORD" --protected-mode no']
    volumes: [redis1-data:/data]

  rabbit-init:
    image: rabbitmq:4.3.6-management
    hostname: rabbit-init
    restart: "no"
    entrypoint: [sh, /init/rabbit-init.sh]
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBIT_ERLANG_COOKIE:?Gere o .env local}
      RABBITMQ_NODENAME: rabbit@rabbit-init
      RABBIT_EXPECTED_NODES: "1"
    volumes:
      - ./rabbit/init.sh:/init/rabbit-init.sh:ro
      - ./rabbit/definitions.json:/init/definitions.json:ro
    depends_on:
      rabbit1: {condition: service_healthy}
  redis2:
    <<: *redis
    command: [sh, -c, 'exec redis-server --appendonly yes --cluster-enabled yes --cluster-config-file /data/nodes.conf --cluster-node-timeout 5000 --cluster-announce-hostname redis2 --cluster-preferred-endpoint-type hostname --requirepass "$$REDIS_PASSWORD" --masterauth "$$REDIS_PASSWORD" --protected-mode no']
    volumes: [redis2-data:/data]
  redis3:
    <<: *redis
    command: [sh, -c, 'exec redis-server --appendonly yes --cluster-enabled yes --cluster-config-file /data/nodes.conf --cluster-node-timeout 5000 --cluster-announce-hostname redis3 --cluster-preferred-endpoint-type hostname --requirepass "$$REDIS_PASSWORD" --masterauth "$$REDIS_PASSWORD" --protected-mode no']
    volumes: [redis3-data:/data]

  redis-init:
    image: redis:8.2.10-alpine
    restart: "no"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Gere o .env local}
      REDIS_NODE_COUNT: "3"
      REDIS_REPLICAS: "0"
    command: [sh, /init/redis-init.sh]
    volumes:
      - ./redis/init.sh:/init/redis-init.sh:ro
    depends_on:
      redis1: {condition: service_healthy}
      redis2: {condition: service_healthy}
      redis3: {condition: service_healthy}

  api:
    <<: *application
    command: [uvicorn, backend.api.main:app, --host, 0.0.0.0, --port, "8000", --no-access-log]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health',timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
  worker:
    <<: *application
    command: [python, -m, backend.worker.main]
  alerts:
    <<: *application
    command: [python, -m, backend.alerts.main]
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - ${ECOPULSE_BIND_ADDRESS:-127.0.0.1}:8000:8000
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: {condition: service_started}

volumes:
  postgres-data:
  rabbit1-data:
  redis1-data:
  redis2-data:
  redis3-data:
